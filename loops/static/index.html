<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparrow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22spg%22%20x1%3D%220%22%20y1%3D%221%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231F1D4D%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233B34C9%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23spg%29%22/%3E%3Cpath%20d%3D%22M9%2055l7-7M5%2047l6-6M17%2059l5-5%22%20stroke%3D%22%238FF0D0%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.9%22/%3E%3Cpath%20d%3D%22M49.5%2014.5%2043.8%2016.2C39.6%2012.4%2032.6%2013.6%2029.8%2019.2%2026.2%2026.6%2021%2031.4%2013%2034.2l6.4%202.6-3.6%207.6%2011-5.6C35.6%2038%2042%2032.6%2044.4%2025c.9-2.9%201.3-5.2%205.1-10.5z%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M34.6%2025.4C31.2%2018%2025.6%2013.6%2017.6%2012.2c2.6%207.2%207.4%2013%2013.6%2016.2z%22%20fill%3D%22%238FF0D0%22/%3E%3Cpath%20d%3D%22M36.2%2031.5c3.2-.6%205.6-2.6%206.9-5.4%22%20stroke%3D%22%23E8B27A%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3Ccircle%20cx%3D%2240.2%22%20cy%3D%2218.6%22%20r%3D%221.8%22%20fill%3D%22%231F1D4D%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EE;--surface:#FFFFFF;--raised:#FBFAF8;--ink:#17181C;--muted:#62656E;--faint:#9A9CA3;--line:#E4E1DB;
  --accent:#0E7C66;--accent-ink:#FFFFFF;--accent-soft:#DDF1EA;--late:#C2410C;--soon:#A16207;
  --shadow:0 1px 2px rgba(23,24,28,.04),0 6px 24px rgba(23,24,28,.06);
  --jobs:#4F46E5;--study:#B45309;--work:#0369A1;--money:#BE185D;--personal:#15803D;--other:#57534E;
  --font:"Bricolage Grotesque",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101114;--surface:#191A1F;--raised:#1E2026;--ink:#ECEDEF;--muted:#A2A5AD;--faint:#6E717A;--line:#2A2C33;
  --accent:#34C6A5;--accent-ink:#06201A;--accent-soft:#12332B;--late:#F2804E;--soon:#E4B650;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --jobs:#8B85FF;--study:#F0A04B;--work:#4FB3E8;--money:#F06AA8;--personal:#4ACB7A;--other:#A8A29E}}
:root[data-theme="dark"]{
  --bg:#101114;--surface:#191A1F;--raised:#1E2026;--ink:#ECEDEF;--muted:#A2A5AD;--faint:#6E717A;--line:#2A2C33;
  --accent:#34C6A5;--accent-ink:#06201A;--accent-soft:#12332B;--late:#F2804E;--soon:#E4B650;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --jobs:#8B85FF;--study:#F0A04B;--work:#4FB3E8;--money:#F06AA8;--personal:#4ACB7A;--other:#A8A29E}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(80px);opacity:.16;left:50%;top:50%;margin:-26vmax 0 0 -26vmax;animation:orbit 38s linear infinite}
.aura i:nth-child(1){background:var(--accent);transform-origin:40% 60%}
.aura i:nth-child(2){background:var(--jobs);animation-duration:52s;animation-direction:reverse;transform-origin:65% 35%}
.aura i:nth-child(3){background:var(--study);opacity:.1;animation-duration:70s;transform-origin:30% 30%}
@keyframes orbit{from{transform:rotate(0deg) translateX(18vmax) rotate(0deg)}to{transform:rotate(360deg) translateX(18vmax) rotate(-360deg)}}
@media (prefers-color-scheme:dark){.aura i{opacity:.12}}
.brand{display:flex;align-items:center;gap:10px;font-weight:780;font-size:1.25rem;letter-spacing:-.02em}
.brand .logo{width:34px;height:34px;flex:none;border-radius:9px;filter:drop-shadow(0 6px 14px rgba(59,52,201,.35));transition:transform .4s var(--ease)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}
.wrap{position:relative;z-index:1}
.composer{z-index:5}
.wrap{max-width:1480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 190px}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hello{margin:0;font-size:.95rem;color:var(--muted)}
.icons{display:flex;gap:4px;align-items:center}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.ib:hover{background:var(--surface);color:var(--ink)}
.ib.on{color:var(--accent)}
.status{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent)}
.pulse.run{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.warn{color:var(--soon)}
.src-chip{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--surface);border-radius:999px;padding:5px 11px 5px 9px;font-size:.82rem;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.src-chip .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.src-chip.ok .d{background:var(--accent)}
.src-chip.error .d{background:var(--late)}
.src-chip.checking .d{background:var(--soon);animation:pulse 1.2s infinite}
.src-chip span{color:var(--muted)}
.src-chip.error span{color:var(--late)}
.src-chip.off{box-shadow:0 0 0 1px var(--line);background:transparent}
.src-chip.off span{color:var(--accent);font-weight:650}
.src-chip.tip span{color:var(--muted)}
.steps{margin:0 0 16px;padding-left:20px;font-size:.93rem;display:grid;gap:8px}
.steps a{color:var(--ink);font-weight:600}
.steps code,.copyrow code{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.86rem;overflow-wrap:anywhere}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.note{font-size:.86rem;color:var(--muted);margin:10px 0 0}
.bigbtn{width:100%;justify-content:center;display:flex;gap:10px;align-items:center;padding:13px 18px;font-size:1rem}
.focusbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px 9px 12px;font-weight:650;font-size:.92rem;transition:transform .2s var(--ease)}
.focusbtn:hover{transform:translateY(-1px)}
.focusbtn .live{width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* live clock: time is passing, and here's the next deadline */
.clock-side{margin-top:14px;padding:14px 16px;border-radius:20px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:end}
.clock-side .place{font-size:.78rem;color:var(--muted);font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.clock-side .t{font-size:1.9rem;font-weight:760;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clock-side .t small{font-size:.9rem;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:2px}
.clock-side .t small b{color:var(--accent);font-weight:700}
.clock-side .next{grid-column:1/-1;font-size:.86rem;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.clock-side .next b{color:var(--ink);font-weight:650}
.clock-side .cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.clock-side .cd.late{color:var(--late)} .clock-side .cd.soon{color:var(--soon)}
.donering{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);justify-self:end}
.donering b{display:grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.95rem}
.soundbtn{border:0;background:none;color:var(--faint);font-size:.78rem;padding:0;justify-self:end}

.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:70;left:0;top:0}
/* layout: calendar on the left, what's left to do on the right */
.layout{display:grid;grid-template-columns:minmax(0,65fr) minmax(330px,35fr);gap:22px;align-items:start;margin-top:14px}
.side{min-width:0}
.side .clock-side{margin-top:0}
.side .hero h1{font-size:clamp(1.5rem,2.3vw,2.25rem)}
@media (max-width:1099px){.layout{grid-template-columns:1fr}.side{max-width:720px;margin:0 auto;width:100%}}
/* calendar */
.calpane{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:14px 14px 10px;position:sticky;top:12px;height:calc(100vh - 250px);min-height:560px;display:flex;flex-direction:column;overflow:hidden}
@media (max-width:1099px){.calpane{position:relative;top:0;height:72vh;min-height:480px}}
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 4px 10px}
.calhead h2{margin:0 6px 0 4px;font-size:1.15rem;letter-spacing:-.01em;flex:1;min-width:120px}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.navb{width:32px;height:32px;border-radius:10px;border:0;background:var(--raised);display:grid;place-items:center;color:var(--ink)}
.calscroll{flex:1;overflow:auto;position:relative;border-top:1px solid var(--line);overscroll-behavior:contain}
.cgrid{display:grid;position:relative}
.dayhead{position:sticky;top:0;z-index:4;background:var(--surface);text-align:center;padding:6px 2px 4px;height:62px;box-sizing:border-box;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--line)}
.dayhead b{display:block;font-size:1.15rem;color:var(--ink);font-weight:720;line-height:1.1}
.dayhead.today b{color:#fff;background:var(--accent);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;margin:2px auto 0}
.allday{position:sticky;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:26px}
.dl{font-size:.7rem;font-weight:650;border-radius:6px;padding:2px 6px;background:color-mix(in srgb,var(--late) 10%,transparent);color:var(--late);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dl.ok{background:var(--raised);color:var(--muted)} .dl.soon{background:color-mix(in srgb,var(--soon) 12%,transparent);color:var(--soon)}
.gutter{position:relative}
.gutter span{position:absolute;right:6px;transform:translateY(-50%);font-size:.7rem;color:var(--faint)}
.daycol{position:relative;border-left:1px solid var(--line)}
.daycol.today{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.daycol .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 7px);pointer-events:none}
.hline{position:absolute;left:0;right:0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);pointer-events:none}
.blk{position:absolute;border-radius:9px;padding:4px 7px;font-size:.76rem;line-height:1.25;overflow:hidden;box-sizing:border-box;cursor:pointer;
  border-left:3px solid var(--c,var(--other));background:color-mix(in srgb,var(--c,var(--other)) 14%,var(--surface));color:var(--ink);transition:box-shadow .2s}
.blk b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{color:var(--muted)}
.blk.task{touch-action:none;cursor:grab;background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.blk.task:not(.fixed){border-style:dashed;border-left-style:solid;border-width:1px 1px 1px 3px;border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.blk.task.fixed{background:color-mix(in srgb,var(--c) 30%,var(--surface))}
.blk.late{box-shadow:0 0 0 1.5px var(--late) inset}
.blk.event{--c:var(--faint);background:var(--raised);cursor:default}
.blk.meet{--c:var(--jobs);background:color-mix(in srgb,var(--jobs) 18%,var(--surface))}
.blk.dragging{cursor:grabbing;z-index:20;box-shadow:0 14px 30px -8px rgba(0,0,0,.35);opacity:.95}
.blk:hover{box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
.duetick{position:absolute;left:0;right:0;border-top:2px dashed var(--late);pointer-events:none;opacity:.7}
.nowline{position:absolute;left:-4px;right:0;border-top:2px solid var(--late);z-index:6;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--late)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-top:6px}
.month .mh{font-size:.72rem;color:var(--muted);text-align:center;padding:2px}
.mcell{min-height:92px;border-radius:12px;background:var(--raised);padding:6px;font-size:.72rem;cursor:pointer;overflow:hidden}
.mcell.other{opacity:.45}
.mcell.today{box-shadow:0 0 0 2px var(--accent) inset}
.mcell .n{font-weight:720;font-size:.85rem}
.mcell i{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;padding-left:6px;border-left:3px solid var(--c,var(--faint))}
.calfoot{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);padding:8px 4px 0}
.calfoot span{display:inline-flex;align-items:center;gap:5px}
.calfoot i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* wins */
#wins{display:grid;gap:12px;margin-top:22px}
#wins:empty{display:none}
.win{position:relative;display:grid;grid-template-columns:48px 1fr;gap:14px;padding:18px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.win::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--accent-soft),transparent 60%);opacity:.9;pointer-events:none}
.win>*{position:relative}
.badge{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative}
.badge.q{background:var(--raised);color:var(--accent);border:2px solid var(--accent)}
.badge svg path{stroke-dasharray:24;stroke-dashoffset:0}
.eyebrow{margin:0;font-size:.8rem;font-weight:650;letter-spacing:.02em;color:var(--accent);text-transform:uppercase}
.win h3{margin:2px 0 4px;font-size:1.22rem;line-height:1.2;letter-spacing:-.01em}
.src{margin:0;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem;transition:border-color .2s,transform .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
a.btn{color:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;left:21px;top:21px;pointer-events:none}

/* hero */
.hero{margin-top:26px;padding:26px 24px 22px;border-radius:26px;position:relative;overflow:hidden;box-shadow:var(--shadow);border:1.5px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--a),transparent 0 62%,var(--accent) 78%,var(--jobs) 90%,transparent 100%) border-box;
  animation:ring 7s linear infinite;transition:transform .35s var(--ease),box-shadow .35s}
@keyframes ring{to{--a:360deg}}
.hero:hover,.area:hover,.win:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 18px 40px -18px rgba(0,0,0,.25)}
.area,.win{transition:transform .35s var(--ease),box-shadow .35s}
.hero .lead{margin:0 0 8px;color:var(--muted);font-size:.9rem;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:650;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--other)) 13%,transparent);color:var(--c,var(--other))}
.hero h1 .w{display:inline-block;will-change:transform}
.hero h1{margin:0;font-size:clamp(1.85rem,6vw,2.9rem);line-height:1.04;font-weight:760;letter-spacing:-.028em;max-width:20ch;font-variation-settings:"opsz" 96;overflow-wrap:anywhere}
.hero .why{margin:12px 0 0;font-size:1.04rem;max-width:52ch}
.hero .why.late{color:var(--late)}
.heroacts{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.closer{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--accent);color:var(--accent-ink);padding:8px 20px 8px 8px;border-radius:999px;font-weight:650;font-size:1rem;transition:transform .2s var(--ease)}
.closer:hover{transform:translateY(-1px)}
.closer .ring{width:30px;height:30px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center}
.closer .ring svg{opacity:0;transform:scale(.5);transition:all .25s var(--ease)}
.closer:hover .ring svg{opacity:1;transform:none}
.say{margin:18px 0 0;padding:12px 14px;border-radius:14px;background:var(--raised);border:1px solid var(--line);max-width:58ch;font-size:.95rem}
.say p{margin:0}
.empty{margin-top:26px;padding:34px 24px;border-radius:26px;border:1.5px dashed var(--line);text-align:center;color:var(--muted)}
.empty h1{margin:6px 0 0;font-size:1.6rem;letter-spacing:-.02em;color:var(--ink)}

/* area sections */
#areas{margin-top:14px}
.area{transition:box-shadow .3s;margin-top:14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.ahead{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:16px 18px;text-align:left}
.ahead .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ahead h2{margin:0;font-size:1.02rem;font-weight:700;letter-spacing:-.01em;flex:1}
.count{font-size:.82rem;font-weight:650;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:999px;padding:2px 9px;min-width:26px;text-align:center}
.chev{color:var(--faint);transition:transform .3s var(--ease)}
.area.shut .chev{transform:rotate(-90deg)}
.abody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease)}
.area.shut .abody{grid-template-rows:0fr}
.ainner{overflow:hidden;min-height:0}
.rows{list-style:none;margin:0;padding:0 8px 8px}

async function api(path,opts={}){

const hm=d=>new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hourCycle:'h23'});

/* ---------- motion ----------
   Springs come from Motion (motion.dev), bundled in static/vendor. If it's missing,
   the same animations run on the browser's built-in engine with a spring-shaped curve. */
const SPRING='linear(0,0.009,0.035 2.1%,0.141 4.4%,0.723 12.9%,0.938 16.7%,1.017 20.3%,1.043 24.3%,1.035 28.5%,1.013 34.1%,0.998 39.8%,0.995 48.4%,1)';
const anim=(el,kf,o)=>RM||!el||!el.animate?{finished:Promise.resolve()}:el.animate(kf,{duration:320,easing:SPRING,fill:'none',...o});
/* motion(el, {opacity:[0,1], y:[12,0], scale:[.96,1]}, {bounce, delay, vd}) -> Promise */
function motion(el,props,o={}){
  if(RM||!el)return Promise.resolve();
  const Mo=window.Motion, moves=['x','y','scale','rotate'].some(k=>k in props);
  const clean=()=>{if(moves&&el.isConnected)el.style.transform=''};
  if(Mo&&Mo.animate){
    try{
      const opts=o.duration?{duration:o.duration,delay:o.delay||0,ease:o.ease||[.2,.8,.2,1]}
        :{type:Mo.spring,bounce:o.bounce??.22,visualDuration:o.vd??.42,delay:o.delay||0};
      return Promise.resolve(Mo.animate(el,props,opts)).then(clean,clean);
    }catch(e){}
  }
  const n=Math.max(...Object.values(props).map(v=>Array.isArray(v)?v.length:1));
  const frames=[...Array(n)].map((_,i)=>{const f={},t=[];
    for(const [k,v] of Object.entries(props)){const x=Array.isArray(v)?v[Math.min(i,v.length-1)]:v;
      if(k==='x')t.push(`translateX(${x}px)`);else if(k==='y')t.push(`translateY(${x}px)`);else if(k==='scale')t.push(`scale(${x})`);
      else if(k==='rotate')t.push(`rotate(${x}deg)`);else f[k]=typeof x==='number'&&k!=='opacity'?x+'px':x}
    if(t.length)f.transform=t.join(' ');return f});
  return el.animate(frames,{duration:(o.duration||o.vd*1.6||.62)*1000,delay:(o.delay||0)*1000,easing:o.duration?EASE:SPRING,fill:'backwards'}).finished.then(clean,clean);
}
function enter(el,i=0){
  const d=Math.min(i,10)*.045;
  if(el.classList.contains('win'))return motion(el,{opacity:[0,1],y:[-40,0],scale:[.82,1],rotate:[-2,0]},{bounce:.45,vd:.6,delay:d});
  if(el.classList.contains('area'))return motion(el,{opacity:[0,1],y:[46,0],scale:[.9,1]},{bounce:.32,vd:.6,delay:d});
  motion(el,{opacity:[0,1],y:[24,0],scale:[.96,1]},{bounce:.35,vd:.5,delay:d});
}
function leave(el){
  if(el.classList.contains('leaving'))return;
  el.classList.add('leaving');el.style.pointerEvents='none';
  const h=el.offsetHeight;el.style.overflow='hidden';
  // Slide out and fade first, then close the gap, so the rest of the list glides up
  motion(el,{opacity:[1,0],x:[0,28],scale:[1,.98]},{duration:.22}).then(()=>{
    el.style.opacity='0';
    return anim(el,[{height:h+'px'},{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px'}],{duration:380,fill:'forwards'}).finished;
  }).then(()=>el.remove());
}
function snap(){const m=new Map();document.querySelectorAll('main [data-key]').forEach(el=>{if(!el.classList.contains('leaving'))m.set(el,el.getBoundingClientRect())});return m}
function flip(before){
  if(RM)return;
  before.forEach((r,el)=>{
    if(!el.isConnected||el.classList.contains('leaving'))return;
    const n=el.getBoundingClientRect();let dy=r.top-n.top;
    const p=el.parentElement&&el.parentElement.closest('[data-key]');
    if(p&&before.has(p)){dy-=before.get(p).top-p.getBoundingClientRect().top}
    if(Math.abs(dy)>1)motion(el,{y:[dy,0]},{bounce:.3,vd:.55});
  });
}

}

let actx=null;
function chime(){
  if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
    [[784,0],[1175,.09],[1568,.18]].forEach(([f,dt])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(.16,t+dt+.015);g.gain.exponentialRampToValueAtTime(.001,t+dt+.5);
      o.connect(g).connect(actx.destination);o.start(t+dt);o.stop(t+dt+.55)})}catch(e){}
}

    const kf=[...Array(9)].map((_,k)=>{const t=k/8*T, px=x+Math.cos(a)*v*t, py=y+Math.sin(a)*v*t+700*t*t;
      return {transform:`translate(${px}px,${py}px) rotate(${spin*t}deg) scale(${1-k/12})`,opacity:k<6?1:1-(k-5)/3}});

const frag=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
/* keep elements with the same key, patch changed ones, animate the rest in and out */
function reconcile(parent,items,newbies){
  const have=new Map([...parent.children].filter(e=>e.dataset.key).map(e=>[e.dataset.key,e]));
  const want=new Set(items.map(i=>i.key));
  have.forEach((el,k)=>{if(!want.has(k))leave(el)});
  let prev=null;
  items.forEach(it=>{
    let el=have.get(it.key);
    if(el&&el.classList.contains('leaving')){el.getAnimations().forEach(a=>a.cancel());el.classList.remove('leaving');el.style.cssText=''}
    if(!el){el=frag(it.html);el.dataset.key=it.key;el.dataset.sig=it.html;newbies.push(el)}
    else if(el.dataset.sig!==it.html){const n=frag(it.html);el.className=n.className;el.innerHTML=n.innerHTML;if(n.getAttribute('style'))el.setAttribute('style',n.getAttribute('style'));el.dataset.sig=it.html}
    const ref=prev?prev.nextSibling:parent.firstChild;
    if(el!==ref)parent.insertBefore(el,ref);
    prev=el;
  });
}
function sparkle(host){

function ago(iso){const m=Math.floor((Date.now()-new Date(iso))/60000);return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.floor(m/60)}h ago`:'over a day ago'}

function wireDrag(){
  document.querySelectorAll('.blk.task').forEach(b=>{
    b.onpointerdown=e=>{
      if(e.button!==0)return;e.preventDefault();
      const cols=[...document.querySelectorAll('.daycol')], rects=cols.map(c=>c.getBoundingClientRect());
      const home=b.parentElement, hr=home.getBoundingClientRect(), br=b.getBoundingClientRect();
      const sx=e.clientX, sy=e.clientY, top0=parseFloat(b.style.top); let moved=false, target=home, newTop=top0;
      b.setPointerCapture(e.pointerId);
      b.onpointermove=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        if(!moved&&Math.hypot(dx,dy)<6)return;
        if(!moved){moved=true;b.classList.add('dragging')}
        const ci=rects.findIndex(r=>ev.clientX>=r.left&&ev.clientX<r.right); target=ci>=0?cols[ci]:target;
        const tr=target.getBoundingClientRect();
        newTop=Math.max(0,Math.round((top0+dy)/(HOUR/4))*(HOUR/4));
        b.style.transform=`translate(${tr.left-hr.left}px,${newTop-top0}px)`;
        const m=SHOW_FROM*60+newTop/HOUR*60;b.querySelector('small').textContent=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
      };
      b.onpointerup=async ev=>{
        b.onpointermove=b.onpointerup=null;
        if(!moved){const l=S&&S.loops.find(x=>x.id===+b.dataset.block);if(l)taskSheet(l);return}
        b.classList.remove('dragging');
        const day=new Date(target.dataset.day), m=SHOW_FROM*60+newTop/HOUR*60;
        day.setHours(Math.floor(m/60),m%60,0,0);

        try{const r=await api(`/api/loops/${b.dataset.block}/move`,{method:'POST',body:{start:day.toISOString()}});
          toast(r.warning||`Moved to ${day.toLocaleDateString([], {weekday:'short'})} ${hm(day)}. Sparrow will hold you to it.`);
          await refresh()}catch(err){toast(err.message);loadCal()}
      };
    };
  });
}

let pending=null;
function closeS(){['scrim','sheet'].forEach(i=>{const x=$(i);if(x)x.remove()});if(pending){const p=pending;pending=null;p(null)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeS()});
function frame(html){
  const had=!!$('sheet');
  ['scrim','sheet'].forEach(i=>{const x=$(i);if(x)x.remove()});
  const s=document.createElement('div');s.className='scrim';s.id='scrim';s.onclick=closeS;
  const d=document.createElement('div');d.className='sheet';d.id='sheet';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=html;
  document.body.append(s,d);
  if(!had){
    anim(s,[{opacity:0},{opacity:1}],{duration:260});
    const r=d.getBoundingClientRect();
    if(innerWidth>=720){d.style.transformOrigin=`${lastTap.x-r.left}px ${lastTap.y-r.top}px`;motion(d,{opacity:[0,1],scale:[.4,1]},{bounce:.3,vd:.5})}
    else motion(d,{y:[r.height,0]},{bounce:.2,vd:.45});
  }else{const kids=[...d.children];kids.forEach((k,i)=>motion(k,{opacity:[0,1],x:[30,0]},{bounce:.3,vd:.4,delay:i*.03}))}
  return d;
}
function step({ctx,q,kind='choice',options=[],n=1,of=1,skip=false,skipLabel='',placeholder=''}){
  return new Promise(res=>{
    pending=res;
    const bar=`<div class="progress"><i style="width:${Math.round(100*(n-1)/of)}%"></i></div>`;
    const body=kind==='choice'
      ?`<div class="choices">${options.map((o,k)=>`<button data-k="${k}">${esc(o.label)}</button>`).join('')}</div>${skip?`<div class="srow"><button class="btn ghost" id="s-skip">${skipLabel||'Skip'}</button></div>`:''}`
      :`<div class="inrow"><textarea id="s-text" placeholder="${esc(placeholder)}"></textarea><button class="mic" id="s-mic" aria-label="Dictate">${MIC}</button></div><div class="srow"><button class="btn pri" id="s-save">Next</button>${skip?`<button class="btn ghost" id="s-skip">${skipLabel||'Nothing to add'}</button>`:''}</div>`;
    const d=frame(`${of>1?bar:''}${ctx?`<p class="ctx">${esc(ctx)}</p>`:''}<h2>${esc(q)}</h2>${body}`);
    if(of>1)requestAnimationFrame(()=>{const i=d.querySelector('.progress i');if(i)i.style.width=Math.round(100*n/of)+'%'});
    const done=v=>{stopAllMics();pending=null;res(v)};
    if(kind==='choice'){d.querySelector('.choices').onclick=e=>{const b=e.target.closest('button');if(b)done(options[+b.dataset.k].value)};d.querySelector('.choices button').focus()}
    else{const t=d.querySelector('#s-text');t.focus();attachMic(d.querySelector('#s-mic'),t);d.querySelector('#s-save').onclick=()=>done(t.value.trim());
      t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();done(t.value.trim())}})}
    const sk=d.querySelector('#s-skip');if(sk)sk.onclick=()=>done('');
  });
}

function unTick(id){document.querySelectorAll(`[data-key="r${id}"]`).forEach(e=>e.classList.remove('ticking'))}
let tapDone={x:innerWidth/2,y:innerHeight/2};
async function closeFlow(l){
  tapDone={...lastTap};
  loading('One moment');
  let Q;try{Q=await api(`/api/loops/${l.id}/closing`)}catch(e){closeS();unTick(l.id);toast(e.message);return}
  const of=1+Q.followups.length;
  const h=await step({ctx:l.summary,q:Q.happened,options:Q.happened_options,n:1,of});
  if(h===null)return unTick(l.id);
  if(h==='not_yet'){unTick(l.id);return laterFlow(l)}
  if(h==='no'){closeS();await api(`/api/loops/${l.id}/finish`,{method:'POST',body:{happened:'no'}});toast('Closed as not needed.');return refresh()}
  const answers=[];
  for(let i=0;i<Q.followups.length;i++){
    const f=Q.followups[i];
    const v=await step({ctx:l.summary,q:f.question,kind:f.kind,options:(f.options||[]).map(o=>({label:o,value:o})),n:i+2,of,skip:true,
      placeholder:f.use==='next_loop'?'e.g. Send a thank-you email tomorrow morning':f.use==='interview_notes'?'Who you met, what you talked about, anything they asked, next steps':''});
    if(v===null)return unTick(l.id);
    answers.push({question:f.question,use:f.use,value:v});
  }
  if(answers.some(a=>a.use==='interview_notes'))loading('Writing it up');else closeS();
  const r=await api(`/api/loops/${l.id}/finish`,{method:'POST',body:{happened:'yes',answers}});
  celebrate(tapDone.x,tapDone.y);
  await refresh();
  if(r.write_up)return writeUpSheet(r.write_up,r.created);
  closeS();
  toast(r.created.length?`Done. Added: ${r.created.map(c=>c.summary).join(', ')}`:'Nice. Done.');

}

function whereAmI(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);
  navigator.geolocation.getCurrentPosition(p=>ok(p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)),()=>ok(null),{timeout:10000,maximumAge:600000})})}
async function askMissing(c){
  const got={};
  const qs=c.questions;
  for(let i=0;i<qs.length;i++){
    const q=qs[i];
    if(q.skip_if&&Object.entries(q.skip_if).every(([k,v])=>got[k]===v))continue;
    if(q.locate&&got.here==null){const at=await whereAmI();
      if(at){got.here=at;await api(`/api/loops/${c.id}`,{method:'PATCH',body:{here:at}})}}
    if(q.skip_if_set&&got[q.skip_if_set]!=null)continue;
    const v=await step({ctx:c.summary,q:q.question,kind:q.kind||'choice',options:q.options||[],n:i+1,of:qs.length,skip:true,placeholder:q.placeholder||''});
    if(v===null)return;
    got[q.field]=v;
    if(v!==''){const r=await api(`/api/loops/${c.id}`,{method:'PATCH',body:{[q.field]:v}});
      Object.assign(got,(r&&r.set)||{});
      if(r&&r.route)toast(`${r.route.minutes} min each way (${r.route.km} km)${r.route.to?' to '+r.route.to:''}.`);
      else if(r&&r.route_error)toast(`Couldn't look up the route: ${r.route_error}.`)}
  }
  closeS();toast('Got it. Plan updated.');refresh();
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let activeMic=null;
function stopAllMics(){if(activeMic)activeMic.stop()}
function attachMic(btn,box,stateEl){
  let rec=null,listening=false,committed='';
  const stop=()=>{listening=false;if(rec)rec.stop();btn.classList.remove('on');if(stateEl)stateEl.textContent='';if(activeMic&&activeMic.btn===btn)activeMic=null};
  const session=()=>{
    rec=new SR();rec.lang='en-GB';rec.continuous=true;rec.interimResults=true;let cur='';
    rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;cur=t;box.value=(committed+' '+t).trim();box.dispatchEvent(new Event('input'))};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('Microphone blocked. Allow it in the browser\'s site settings.');stop()}};
    rec.onend=()=>{committed=(committed+' '+cur).trim();if(listening){try{session()}catch(err){stop()}}};
    rec.start();
  };
  btn.onclick=()=>{
    if(!SR)return toast('Voice input isn\'t available in this browser. Try Chrome.');
    if(listening)return stop();
    stopAllMics();listening=true;committed=box.value.trim();btn.classList.add('on');if(stateEl)stateEl.textContent='Listening. Tap the mic again to stop.';
    activeMic={btn,stop};
    try{session()}catch(err){stop();toast('Couldn\'t start the microphone.')}
  };
}

/* timer */
const TK=()=>'loops.timer.'+D.active.id;
function loadT(){try{T=JSON.parse(localStorage.getItem(TK()))}catch(e){T=null}if(!T)T={phase:'idle',block:0,focusDone:0,lastCheck:Date.now()}}
function saveT(){try{localStorage.setItem(TK(),JSON.stringify(T))}catch(e){}}
const F=()=>D.active.focus_min, B=()=>D.active.break_min;
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function startFocus(){T.phase='focus';T.endsAt=Date.now()+F()*60000;T.paused=null;saveT();renderClock()}
function startBreak(min){T.phase='break';T.endsAt=Date.now()+min*60000;T.breakLen=min;saveT();showBreak()}
function endFocus(early){
  const done=early?Math.round((F()*60000-(T.endsAt-Date.now()))/60000):F();
  T.focusDone+=Math.max(0,done);T.block++;saveT();
  notify('Focus block done','Time for a '+B()+' minute break.');
  if(!fopen())openFocus();
  startBreak(B());
}
const C2=2*Math.PI*84;
function renderClock(){
  const el=$('clock');if(!el)return;
  const counting=!F();
  let num,phase,sub,btns,frac=0,brk=false;
  if(counting){
    const mins=Math.round((Date.now()-new Date(D.active.started))/60000);
    num=`${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}`;phase='Working, no timer';sub='It checks in with you every hour.';frac=(mins%60)/60;
    btns='<button class="btn" id="ckin">Check in now</button>';
  }else if(T.phase==='focus'){
    const left=T.paused!=null?T.paused:T.endsAt-Date.now();frac=1-left/(F()*60000);
    num=mmss(left);phase=`Focus block ${T.block+1}`+(T.paused!=null?', paused':'');
    sub=T.paused!=null?'Paused.':`Break at ${hm(T.endsAt)}.`;
    btns=`<button class="btn dark" id="pp">${T.paused!=null?'Resume':'Pause'}</button><button class="btn" id="early">Take the break now</button>`;
  }else{
    num=mmss(F()*60000);phase=T.block?`Ready for block ${T.block+1}`:'Ready when you are';
    sub=`${F()} min focus, ${B()} min breaks.`+(T.focusDone?` ${T.focusDone} min focused so far.`:'');
    btns='<button class="btn dark" id="go">Start focus block</button>';
  }
  const sig=phase+btns;
  if(el.dataset.sig!==sig){
    el.dataset.sig=sig;
    el.innerHTML=`<div class="clock${brk?' brk':''}"><div class="dial"><svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="84" fill="none" stroke-width="12"/>
      <circle class="arc" id="arc" cx="100" cy="100" r="84" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C2}" stroke-dashoffset="${C2}"/></svg><div class="num" id="cnum"></div></div>
      <div><p class="phase">${phase}</p><p class="sub">${sub}</p><div class="acts" style="margin-top:0">${btns}</div></div></div>`;
    if($('go'))$('go').onclick=startFocus;
    if($('pp'))$('pp').onclick=()=>{if(T.paused!=null){T.endsAt=Date.now()+T.paused;T.paused=null}else T.paused=T.endsAt-Date.now();saveT();renderClock()};
    if($('early'))$('early').onclick=()=>endFocus(true);
    if($('ckin'))$('ckin').onclick=()=>checkin();
  }
  $('cnum').textContent=num;
  $('arc').style.strokeDashoffset=String(C2*(1-Math.max(0,Math.min(1,frac))));
}
setInterval(()=>{
  if(!D||!D.active||!T)return;
  if(T.phase==='focus'&&T.paused==null&&Date.now()>=T.endsAt)endFocus(false);
  else if(T.phase==='break'){const l=T.endsAt-Date.now();const n=$('bnum');if(n)n.textContent=mmss(l);if(l<=0){T.phase='idle';saveT();notify('Break over','How is it going?');checkin()}}
  if(!F()&&Date.now()-T.lastCheck>=3600000){T.lastCheck=Date.now();saveT();notify('Sparrow','Hour check-in');checkin()}
  if(fopen())renderClock();
},1000);

        ${s.steps.length?`<p class="explain">For each one: ${s.steps.map(x=>esc(x.replace(/\.$/,''))).join('; ')}.</p>`:''}
        <div class="addapp"><textarea id="appin" placeholder="Paste a job link, or the full job description"></textarea>
        <div class="srow"><button class="btn pri" id="appgo">${s.research?'Research it':'Add it'}</button><span class="nums" id="appstate"></span></div></div>
        <div id="apps"></div></section>`:''}
      <div class="srow" style="margin-top:22px"><button class="btn" id="endbtn">End session</button></div>
    </div>
    <aside class="helper"><h2>Helper</h2><p class="hint">Ask about a role, a concept, or how to answer a question. <span id="cvh"></span></p>
      <div id="ctxchip"></div><div class="msgs" id="hmsgs"></div>
      <div class="inrow"><textarea id="hin" placeholder="Ask anything"></textarea><button class="mic" id="hmic" aria-label="Dictate a question">${MIC}</button></div>
      <div class="srow" style="margin-top:8px"><button class="add" id="hsend">Ask</button><span class="nums" id="hstate"></span></div></aside></div>`;
  anim($('fview').firstElementChild,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:380});
  $('endbtn').onclick=endSession;
  attachMic($('hmic'),$('hin'));
  $('hsend').onclick=ask;
  $('hin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
  if($('appgo'))$('appgo').onclick=addApp;
  renderClock();
}
function fill(){
  if(!$('since'))return;
  const s=D.active;
  $('since').textContent=`Focus session, ${D.elapsed_min} min in`;
  const now=getNow();
  $('nowbox').innerHTML=now?`<p class="focusnow">Now: ${esc(now)}. <button class="link" id="nowclear">Back to the plan</button></p>`:'';
  if($('nowclear'))$('nowclear').onclick=()=>setNow('');
  if(s.kind==='apply'){
    const n=s.target||Math.max(D.submitted+1,3);
    $('tally').innerHTML=`<div class="tally">${Array.from({length:n},(_,i)=>`<span class="${i<D.submitted?'on':''}"></span>`).join('')}
      <b>${D.submitted}${s.target?' of '+s.target:''} submitted</b><em>${esc(D.pace)}</em></div>`;
  }
  const items=[
    ...D.events.map(e=>`<li><div><div>${esc(e.title)}</div><div class="w">In your calendar</div></div><div>${hm(e.start)}</div></li>`),
    ...D.assessments.map(a=>`<li><div><div>${esc(a.summary)}</div><div class="w">Due ${new Date(a.due).toLocaleDateString([], {weekday:'long'})} ${hm(a.due)}, about ${Math.round((a.effort_h||1)*60)} min</div></div><button class="link" data-now="${esc(a.summary)}">Do it next</button></li>`),
    ...D.other.map(o=>`<li><div><div>${esc(o.summary)}</div><div class="w">${esc(o.why)}</div></div></li>`)];
  $('aroundSec').hidden=!items.length;$('around').innerHTML=items.join('');
  $('around').querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>setNow(b.dataset.now));
  $('cvh').innerHTML=D.cv?`Using ${esc(D.cv)}. <button class="link" id="cvbtn2">Replace CV</button>`:'<button class="link" id="cvbtn2">Upload your CV</button> for tailored answers.';
  $('cvbtn2').onclick=pickCV;
  if($('apps'))renderApps();
  renderHelper();
}
function list(title,arr){return arr&&arr.length?`<div><h4>${title}</h4><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
function renderApps(){
  const apps=[...D.apps].reverse();
  $('apps').innerHTML=apps.length?apps.map(a=>{
    const r=a.research, sub=a.status==='submitted', skip=a.status==='skipped';
    return `<article class="app${sub||skip?' sub':''}"><h3>${esc(a.role)}</h3><p class="co">${esc(a.company)}${a.url?` <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener">Open job</a>`:''}</p>
      ${sub||skip?`<p class="stag">${sub?'Submitted. It will watch for their reply and remind you to chase in 10 days.':'Skipped'}</p>`:`
      <div class="rs">${r?`${r.summary?`<p>${esc(r.summary)}</p>`:''}${list('What they want most',r.top_requirements)}${list('Where you match',r.match)}${list('Gaps to address',r.gaps)}
        ${list('For “why this company”',r.talking_points)}${r.watch_out?`<div><h4>Watch out</h4><p>${esc(r.watch_out)}</p></div>`:''}${r.deadline?`<p><b>Deadline:</b> ${esc(r.deadline)}</p>`:''}`
        :'<p class="nums">No research on this one. Ask the helper anything about it.</p>'}</div>
      <div class="acts"><button class="btn pri" data-sub="${a.id}">Mark submitted</button><button class="btn" data-ask="${a.id}">Ask about this role</button><button class="btn ghost" data-skip="${a.id}">Skip it</button></div>`}
    </article>`}).join(''):'<p class="nums" style="margin-top:12px">Paste your first job above to start.</p>';
  $('apps').querySelectorAll('[data-sub]').forEach(b=>b.onclick=async()=>{await api('/api/apps/'+b.dataset.sub,{method:'POST',body:{status:'submitted'}});toast('Submitted. It will watch for their reply.');loadFocus()});
  $('apps').querySelectorAll('[data-skip]').forEach(b=>b.onclick=async()=>{await api('/api/apps/'+b.dataset.skip,{method:'POST',body:{status:'skipped'}});loadFocus()});
  $('apps').querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{focusApp=+b.dataset.ask;renderHelper();$('hin').focus()});
}
async function addApp(){
  const v=$('appin').value.trim();if(!v)return toast('Paste a job link or description first.');
  $('appgo').disabled=true;$('appstate').textContent=D.active.research?'Reading the job and researching the company. This can take 20 to 40 seconds.':'Adding';
  try{const r=await api('/api/apps',{method:'POST',body:{input:v}});$('appin').value='';focusApp=r.id;
    toast(r.researched?`Researched: ${r.role} at ${r.company}`:`Added: ${r.role}`);await loadFocus()}
  catch(e){toast(e.message)}finally{$('appgo').disabled=false;$('appstate').textContent=''}
}
function renderHelper(){
  const a=focusApp&&D.apps.find(x=>x.id===focusApp);
  $('ctxchip').innerHTML=a?`<span class="pchip">About: ${esc(a.role)} at ${esc(a.company)} <button aria-label="Clear">×</button></span>`:'';
  if(a)$('ctxchip').querySelector('button').onclick=()=>{focusApp=null;renderHelper()};
  const m=$('hmsgs');
  m.innerHTML=D.helper.length?D.helper.map(x=>`<div class="msg ${x.role==='you'?'you':'coach'}">${esc(x.text)}</div>`).join('')
    :'<div class="msg coach">I\'m here while you work. Paste a job and I\'ll research it, or ask me anything.</div>';
  m.scrollTop=m.scrollHeight;
}
async function ask(){
  const q=$('hin').value.trim();if(!q)return;stopAllMics();
  D.helper.push({role:'you',text:q});$('hin').value='';renderHelper();$('hstate').textContent='Thinking';
  try{const r=await api('/api/helper',{method:'POST',body:{question:q,app_id:focusApp}});D.helper.push({role:'coach',text:r.answer});renderHelper()}
  catch(e){toast(e.message)}finally{$('hstate').textContent=''}
}
async function endSession(){
  let r;try{r=await api('/api/session/end',{method:'POST'})}catch(e){return toast(e.message)}
  try{localStorage.removeItem(TK());localStorage.removeItem('loops.now.'+D.active.id)}catch(e){}
  built=null;closeFx();D.active=null;T=null;
  $('fview').innerHTML=`<section class="intake"><p class="ctx">Session done</p><h1>${esc(r.summary)}</h1>
    ${r.submitted.length?`<ul class="objs">${r.submitted.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="nums" style="margin-top:12px">Each one is on your list as waiting to hear back. It will spot their reply in your inbox.</p>`:''}
    <div class="srow"><button class="btn pri" id="fdone">Back to your list</button><button class="btn" id="again">Start another</button></div></section>`;
  $('fdone').onclick=closeFocus;$('again').onclick=()=>loadFocus();
}
setInterval(()=>{if(fopen()&&D&&D.active&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName))loadFocus()},60000);

remLabel();
refresh().then(()=>{
  const m=location.hash.match(/^#task-(\d+)/);
  if(m){history.replaceState(null,'',location.pathname);const l=S&&S.loops.find(x=>x.id===+m[1]);if(l)return talkFlow(l)}
  if(location.hash==='#focus'||location.pathname==='/session')openFocus();
  else if(S&&S.session)loadFocus();   // keep the timer running in the background
});
})();
</script>
</body>
</html>
